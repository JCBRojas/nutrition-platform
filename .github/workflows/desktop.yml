# App de escritorio (desktop/, NUT-RN-004): análisis y pruebas, compilación de macOS y
# Windows, y paquetes (.dmg firmado y notarizado, .msix firmado). Con una etiqueta
# desktop-vX.Y.Z publica una versión en GitHub con los paquetes.
#
# Secretos (Settings → Secrets and variables → Actions); sin ellos los paquetes salen sin firmar:
#   macOS:   MACOS_CERTIFICATE (.p12 «Developer ID Application» en base64), MACOS_CERTIFICATE_PASSWORD,
#            MACOS_SIGN_IDENTITY, APPLE_API_KEY (.p8 en base64), APPLE_API_KEY_ID, APPLE_API_ISSUER
#   Windows: WINDOWS_CERTIFICATE (.pfx en base64), WINDOWS_CERTIFICATE_PASSWORD,
#            WINDOWS_PUBLISHER (sujeto del certificado, p. ej. «CN=Mi Empresa, O=Mi Empresa, C=CO»)
name: App de escritorio

on:
  push:
    branches: [main]
    tags: ['desktop-v*']
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.8

defaults:
  run:
    working-directory: desktop

jobs:
  test:
    name: Análisis y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # La etiqueta debe coincidir con la versión de pubspec.yaml
      - name: Versión de la etiqueta
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: |
          VERSION=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          [ "desktop-v$VERSION" = "$GITHUB_REF_NAME" ] || { echo "La etiqueta $GITHUB_REF_NAME no coincide con la versión $VERSION de pubspec.yaml"; exit 1; }

  macos:
    name: macOS (.dmg)
    needs: test
    runs-on: macos-latest
    env:
      # Los secretos no se pueden usar en «if»: se exponen como banderas
      HAS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE != '' }}
      HAS_NOTARY_KEY: ${{ secrets.APPLE_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Certificado de firma en un llavero temporal
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        if: env.HAS_CERTIFICATE == 'true'
        run: |
          KEYCHAIN="$RUNNER_TEMP/firma.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificado.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificado.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificado.p12"
          echo "MACOS_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
      - name: Clave de notarización
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        if: env.HAS_NOTARY_KEY == 'true'
        run: |
          echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/notarizacion.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/notarizacion.p8" >> "$GITHUB_ENV"
      - name: Compilar, firmar, empaquetar y notarizar
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: ./scripts/package_macos.sh
      - name: Borrar llavero y clave
        if: always()
        run: |
          [ -n "${MACOS_KEYCHAIN:-}" ] && security delete-keychain "$MACOS_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/notarizacion.p8"
      - uses: actions/upload-artifact@v4
        with:
          name: nutritrack-macos
          path: desktop/dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows (.msix)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Instalador MSIX
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_PUBLISHER: ${{ secrets.WINDOWS_PUBLISHER }}
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force dist | Out-Null
          $msixArgs = @('run', 'msix:create', '--build-windows', 'false', '--version', "$version.0", '--output-path', 'dist', '--output-name', "NutriTrack-$version-windows")
          if ($env:WINDOWS_CERTIFICATE) {
            $pfx = Join-Path $env:RUNNER_TEMP 'firma.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $msixArgs += @('--certificate-path', $pfx, '--certificate-password', $env:WINDOWS_CERTIFICATE_PASSWORD, '--publisher', $env:WINDOWS_PUBLISHER)
          } else {
            Write-Host 'Aviso: sin WINDOWS_CERTIFICATE, el MSIX se firma con un certificado de prueba (solo pruebas internas).'
          }
          try { dart @msixArgs; if ($LASTEXITCODE) { exit $LASTEXITCODE } }
          finally { if ($pfx) { Remove-Item -Force $pfx -ErrorAction SilentlyContinue } }
          # Versión portable (sin instalar), útil para probar
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "dist/NutriTrack-$version-windows-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: nutritrack-windows
          path: |
            desktop/dist/*.msix
            desktop/dist/*.zip
          if-no-files-found: error

  release:
    name: Publicar versión
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: paquetes
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: NutriTrack de escritorio ${{ github.ref_name }}
          files: paquetes/*
          generate_release_notes: true
